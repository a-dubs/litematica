pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		gradlePluginPortal()
	}
}

// Auto-download a matching JDK for compile tasks (Minecraft 26.x targets Java 25).
plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}
